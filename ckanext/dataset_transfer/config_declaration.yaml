version: 1
groups:
  - annotation: Dataset transfer destination settings
    options:
      - key: ckanext.dataset_transfer.target_organization
        description: Required verified organization identifier on the destination CKAN instance. A deprecated root-path fallback exists only for SFB1153 and SFB1368 transfers to the original LUH repository.
      - key: ckanext.dataset_transfer.target_api_url
        description: Destination CKAN action API base URL, ending in /api/3/action/. Defaults to the original LUH repository.
      - key: ckanext.dataset_transfer.target_public_url
        description: Public base URL used to construct destination dataset links. Defaults to the original LUH repository.
  - annotation: RADAR4Ing publication settings
    options:
      - key: ckanext.dataset_transfer.radar.context_url
        description: HTTPS base URL for the RADAR API environment.
      - key: ckanext.dataset_transfer.radar.workspace_id
        description: RADAR workspace used for publication by the configured technical account.
      - key: ckanext.dataset_transfer.radar.dataset_url_template
        description: Public RADAR dataset URL containing the required {dataset_id} placeholder.
      - key: ckanext.dataset_transfer.radar.client_id
        description: Server-side RADAR technical-account client identifier. Prefer a protected environment variable.
      - key: ckanext.dataset_transfer.radar.client_secret
        description: Server-side RADAR technical-account client secret. Never expose this setting to clients.
      - key: ckanext.dataset_transfer.radar.redirect_url
        description: Redirect URL required by the RADAR token API.
      - key: ckanext.dataset_transfer.radar.user_name
        description: RADAR shared technical-account username.
      - key: ckanext.dataset_transfer.radar.user_password
        description: RADAR shared technical-account password. Never expose this setting to clients.
