{% ckan_extends %}

{% block heading_title %}
    {% asset 'ckanext-dataset-transfer/info-css' %}
    <a href="{{ h.url_for('%s.read' % package.type, id=package.name) }}" title="{{ title }}">
        {{ title|truncate(80) }}
    </a>
    {% if h.is_dataset_published(package.id) %}
        <span class="published-list-tag"><i>published</i></span>
    {% endif %}
{% endblock %}
