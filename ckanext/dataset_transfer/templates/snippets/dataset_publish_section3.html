<section id="publish_step3">
    <div class="row">
        <div class="col-sm-12">
            <div class="alert alert-info text-justify">
                <p>
                    {{_('Please check your dataset metadata before publishing.')}}
                </p>
            </div>
        </div>
    </div>
    <div class="row luh-confirmation">
        <div class="col-sm-12">
            {% snippet "snippets/publish_dataset_metadata_table.html", dataset=pkg_dict %}  
        </div>
    </div>
    <div class="row radar-confirmation">
        <div class="col-sm-12">
            <p>{{ _('The following reviewed values will be sent to RADAR. The source CKAN dataset will remain unchanged.') }}</p>
            <table class="table table-striped radar-confirmation-table"><tbody id="radar_confirmation_body"></tbody></table>
        </div>
    </div>
</section>
